name: Wise Library
version: "0.3.4"
slug: wise_library
description: Library loans and reservations from the Wise web portal
arch:
  - amd64
  - aarch64
startup: application
boot: auto
init: false
ingress: true
ingress_port: 8099
panel_icon: mdi:bookshelf
panel_title: Library
options:
  library_username: ""
  library_password: ""
  branch_id: "2709"
  account_id: home
  poll_interval_minutes: 60
  timezone: Europe/Amsterdam
  mqtt_host: core-mosquitto
  mqtt_port: 1883
  mqtt_username: ""
  mqtt_password: ""
schema:
  library_username: str
  library_password: password
  branch_id: match(^[0-9]{1,8}$)
  account_id: match(^[a-z0-9_]{1,32}$)
  poll_interval_minutes: int(15,1440)
  timezone: str
  mqtt_host: str
  mqtt_port: port
  mqtt_username: str
  mqtt_password: password

url: https://github.com/Davst/ha-wise-library
